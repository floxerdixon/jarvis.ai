name: APK Yapici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Cek
      uses: actions/checkout@v4

    # Bu hazir eylem, tum Android SDK, NDK ve lisans ayarlarini otomatik ve hatasiz yapar.
    - name: Buildozer ile APK Uret
      uses: ArtemSanya/buildozer-action@v1
      with:
        workdir: .
        buildozer_version: stable

    - name: APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-AI-APK
        path: bin/*.apk
        
